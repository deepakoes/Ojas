<!-- ===== OJAS FOOTER ===== -->
<style>
  .ojas-footer {
    --ink: #0d1a2b;
    --ink-soft: #16273d;
    --lamp: #f5b942;
    --mist: #e9eef5;
    --muted: #9fb0c5;
    position: relative;
    overflow: hidden;
    background: var(--ink);
    color: var(--mist);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    padding: 72px 24px 40px;
  }

  .ojas-footer::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    height: 3px; width: 100%;
    background: linear-gradient(90deg, transparent 0%, var(--lamp) 50%, transparent 100%);
    transform: translateX(-100%);
  }
  .ojas-footer.is-visible::before {
    animation: ojas-sweep 1.6s ease-out forwards;
  }

  .ojas-footer::after {
    content: "";
    position: absolute;
    top: -160px; left: 50%;
    width: 520px; height: 320px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(245,185,66,.22), transparent 70%);
    opacity: 0;
    pointer-events: none;
  }
  .ojas-footer.is-visible::after {
    animation: ojas-glow 2.4s ease-out .3s forwards;
  }

  .ojas-footer__inner {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
  }

  .ojas-footer__title {
    margin: 0 0 8px;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 600;
    color: var(--mist);
  }
  .ojas-footer__sub {
    margin: 0 0 40px;
    color: var(--muted);
    max-width: 52ch;
    line-height: 1.6;
  }

  .ojas-footer__grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .ojas-contact {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 22px;
    border: 1px solid rgba(233,238,245,.12);
    border-radius: 14px;
    background: var(--ink-soft);
    color: var(--mist);
    text-decoration: none;
    opacity: 0;
    transform: translateY(24px);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .ojas-footer.is-visible .ojas-contact {
    animation: ojas-rise .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .ojas-footer.is-visible .ojas-contact:nth-child(1) { animation-delay: .15s; }
  .ojas-footer.is-visible .ojas-contact:nth-child(2) { animation-delay: .35s; }
  .ojas-footer.is-visible .ojas-contact:nth-child(3) { animation-delay: .55s; }

  .ojas-contact:hover,
  .ojas-contact:focus-visible {
    border-color: var(--lamp);
    box-shadow: 0 10px 30px rgba(245,185,66,.12);
    outline: none;
  }
  .ojas-contact:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

  .ojas-contact__icon {
    flex: 0 0 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(245,185,66,.12);
    color: var(--lamp);
    transition: background .25s ease, color .25s ease, transform .35s ease;
  }
  .ojas-contact:hover .ojas-contact__icon,
  .ojas-contact:focus-visible .ojas-contact__icon {
    background: var(--lamp);
    color: var(--ink);
    transform: rotate(-8deg) scale(1.08);
  }
  .ojas-contact__icon svg { width: 22px; height: 22px; }

  .ojas-contact__label {
    display: block;
    margin-bottom: 4px;
    font-size: .85rem;
    color: var(--muted);
  }
  .ojas-contact__value {
    display: block;
    font-size: 1.02rem;
    line-height: 1.55;
    font-style: normal;
    color: var(--mist);
    word-break: break-word;
  }

  .ojas-footer__bottom {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid rgba(233,238,245,.1);
    font-size: .875rem;
    color: var(--muted);
  }

  @keyframes ojas-sweep { to { transform: translateX(100%); } }
  @keyframes ojas-glow  { to { opacity: 1; } }
  @keyframes ojas-rise  { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .ojas-footer::before { animation: none !important; }
    .ojas-footer::after { animation: none !important; opacity: 1; }
    .ojas-contact { opacity: 1; transform: none; animation: none !important; }
  }
</style>

    <div class="ojas-footer__grid">

</footer>

<script>
  (function () {
    var footer = document.getElementById("ojasFooter");
    if (!footer) return;
    document.getElementById("ojasYear").textContent = new Date().getFullYear();

    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            footer.classList.add("is-visible");
            io.disconnect();
          }
        });
      }, { threshold: 0.15 });
      io.observe(footer);
    } else {
      footer.classList.add("is-visible");
    }
  })();
</script>
